name: Deploy Super Productivity Web to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Prepare Build Environment
        run: |
          npm run env
          node ./tools/git-version.js
          npm run build:packages

      - name: Build Web Application
        run: |
          npx ng build --configuration productionWeb --base-href /${{ github.event.repository.name }}/

      - name: Configure SPA Routing Fallback (404.html)
        run: |
          # Ensure GitHub Pages returns index.html for SPA sub-routes
          if [ -f "dist/browser/index.html" ]; then
            cp dist/browser/index.html dist/browser/404.html
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
